name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Run Production Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
