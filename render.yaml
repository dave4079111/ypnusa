# Render.com deployment blueprint for the YPN USA Next.js app.
# Deploy without Vercel: runs the real Next.js server (`next start`), so this
# brand-new Next.js 16 build works exactly as it does locally — no framework
# adapter to break. Because it's a persistent Node process, the JSON lead store
# also survives between requests and restarts.
#
# One-time setup at https://dashboard.render.com:
#   New +  →  Blueprint  →  connect the dave4079111/ypnusa repo  →  Apply.
# Render reads this file and provisions the service automatically.
services:
  - type: web
    name: ypnusa
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: ypnusa-data
      mountPath: /var/data/ypnusa
      sizeGB: 1
    envVars:
      # Product app host. Keep this on app.ypnus.com so SEO/canonicals don't
      # collide with the WordPress marketing site on ypnus.com.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://app.ypnus.com
      - key: NEXT_PUBLIC_MARKETING_SITE_URL
        value: https://ypnus.com
      - key: YPNUS_WP_API_BASE
        value: https://ypnus.com/wp-json/ypnus/v1
      # Persist the lead store on Render's writable disk instead of the repo dir.
      - key: LOANPILOT_DATA_DIR
        value: /var/data/ypnusa
      - key: SSO_JWT_ISSUER
        value: https://ypnus.com
      - key: SSO_JWT_AUDIENCE
        value: https://app.ypnus.com
      - key: SSO_ALLOWED_ORIGIN
        value: https://ypnus.com
      - key: MLO_SESSION_TTL_SECONDS
        value: "900"
      - key: SSO_JWT_SECRET
        sync: false
      - key: MLO_LEAD_WEBHOOK_SECRET
        sync: false
      - key: ENTITLEMENT_SYNC_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: OUTREACH_WEBHOOK_URL
        sync: false
      - key: OUTREACH_WEBHOOK_TOKEN
        sync: false
